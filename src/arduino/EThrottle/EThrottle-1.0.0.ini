[ControllerCommands]
; commandName    = command1, command2, commandn...
; command in standard ini format, a command name can be assigned to 1 to n commands that will be executed in order.
;         This dos not include any resultant protocol envelope data, only the response data itself.

; WARNING!! These commands bypass TunerStudio's normal memory synchronization. If these commands
; alter mapped settings (Constant) memory in the controller, TunerStudio will have an out of sync condition 
; and may create error messages.
; It is expected that these commands would not typically alter any ram mapped to a Constant.
  ;                              tableId, offsetMSB, offsetLSB, lenMSB, lenLSB, data[0], data[1], ..., data[len-1]
  cmdClrAllFaults = "w\$tsCanId\x04\x00\x00\x00\x03\x63\x41\x00"  ; uartCmd = "cA"
  cmdClrDriverFault = "w\$tsCanId\x04\x00\x00\x00\x03\x63\x64\x00"  ; uartCmd = "cd"
  cmdClrPPS_Fault = "w\$tsCanId\x04\x00\x00\x00\x03\x63\x70\x00"  ; uartCmd = "cp"
  cmdClrTPS_Fault = "w\$tsCanId\x04\x00\x00\x00\x03\x63\x74\x00"  ; uartCmd = "ct"
  cmdSoftReset = "w\$tsCanId\x04\x00\x00\x00\x02\x72\x00"  ; uartCmd = "r"
  ;                                                     t   e   s   t   E   \0
  cmdTestModeEnable  = "w\$tsCanId\x04\x00\x00\x00\x06\x74\x65\x73\x74\x45\x00"  ; uartCmd = "testE"
  ;                                                     t   e   s   t   D   \0
