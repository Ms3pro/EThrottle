    tVars_ppsSafetyDelta                = scalar, S16 , 26           , "ADC"                                          , 1.000000, 0.000000 
    tVars_tpsSafetyDelta                = scalar, S16 , 28           , "ADC"                                          , 1.000000, 0.000000 
    tVars_idleAdder                     = scalar, U16 , 30           , "%"                                            , 0.010000, 0.000000 
    tVars_ppsAdder                      = scalar, U16 , 32           , "%"                                            , 0.010000, 0.000000 
    tVars_driverFB                      = scalar, U16 , 34           , "ADC"                                          , 1.000000, 0.000000 
    tVars_ppsCompFaultCount             = scalar, U08 , 36           , ""                                             , 1.000000, 0.000000 
    tVars_tpsCompFaultCount             = scalar, U08 , 37           , ""                                             , 1.000000, 0.000000 
    tVars_driverFaultCount              = scalar, U08 , 38           , ""                                             , 1.000000, 0.000000 
    adcStatus_schedIdx                  = bits  , U08 , 39    , [0:3]
    adcStatus_state                     = bits  , U08 , 39    , [4:5], "Stopped","Started","PendingTrigger","Complete"
    adcStatus_rsvd0                     = bits  , U08 , 39    , [6:7]
    adcStatus_convCycles                = bits  , U08 , 40    , [0:7]
    adcStatus_adcsra                    = bits  , U08 , 41    , [0:7]

;-------------------------------------------------------------------------------
;--  The entries are saved in the datalog file in the order in which they     --
;--  appear in the list below.                                                --
;--                                                                           --
;--   Channel - Case sensitive name of output channel to be logged.           --
;--   Label   - String written to header line of log.                         --
;--   Type    - Data type of output, converted before writing.                --
;--   Format  - C-style output format of data.                                --

[Datalog]
    ; *************************************************************************************************************************************
    ;     = Channel        , Label       , Type , Format
    entry = tVars_tpsA     , "TPSA"      , int  , "%d"  
    entry = tVars_tpsB     , "TPSB"      , int  , "%d"  
    entry = tVars_tps      , "TPS"       , float, "%.2f"
    entry = tVars_ppsA     , "PPSA"      , int  , "%d"  
    entry = tVars_ppsB     , "PPSB"      , int  , "%d"  
    entry = tVars_pps      , "PPS"       , float, "%.2f"
    entry = tVars_tpsTarget, "TPS Target", float, "%.2f"
    entry = tVars_motorOut , "Motor Out" , int  , "%d"  
    entry = tVars_idleAdder, "Idle Adder", float, "%.2f"
    entry = tVars_ppsAdder , "PPS Adder" , float, "%.2f"
